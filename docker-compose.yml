services:
  app:
    build: .
    container_name: departamento-site
    # Le o .env diretamente (sem passar pela interpolacao "${VAR}" do Compose).
    # Importante: hashes bcrypt (ADMIN_PASSWORD_HASH) contem "$" seguido de letras
    # (ex.: "$2y$12$hgAqO2V0..."), e o Compose tenta reinterpretar isso como uma
    # variavel quando o valor passa por "${ADMIN_PASSWORD_HASH}" na secao
    # "environment" abaixo — o resultado e o hash chegar truncado/vazio no
    # container. Com "env_file" isso nao acontece, o valor vai literal.
    env_file:
      - .env
    ports:
      - "8097:80"
    environment:
      # Forcado aqui independente do .env: o container roda sempre como producao.
      APP_ENV: production
      APP_DEBUG: "false"
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      # Antivirus nos uploads (opcional) - ver servico "clamav" abaixo.
      # So funciona de verdade se voce subir tambem com --profile clamav.
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    volumes:
      # Conteudo editado pela secretaria e imagens enviadas sobrevivem a rebuilds/deploys.
      - ./storage/content:/var/www/html/storage/content
      - ./storage/uploads:/var/www/html/storage/app/public/uploads
      # Copia de seguranca automatica, criada no servidor logo antes de qualquer
      # restauracao de backup (rede extra contra restaurar o arquivo errado por
      # engano) - nao substitui os backups baixados pelo admin no painel.
      - ./storage/backups-seguranca:/var/www/html/storage/app/private/backups-seguranca
    restart: unless-stopped

  # Antivirus para os uploads do painel admin (imagens e anexos de noticias/editais).
  # Desligado por padrao para nao pesar quem nao precisa: so sobe com
  #   docker compose --profile clamav up -d --build
  # e so tem efeito se CLAMAV_ENABLED=true no .env. Na primeira vez, baixa o banco
  # de assinaturas de virus (freshclam) — pode levar alguns minutos ate ficar pronto.
  clamav:
    image: clamav/clamav:stable
    container_name: departamento-clamav
    profiles: ["clamav"]
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav

volumes:
  clamav_data:
